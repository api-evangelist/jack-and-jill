name: Jack & Jill
description: >-
  Jack & Jill is an AI hiring platform built around two complementary AI agents. Jack is a
  free AI career agent for candidates: it scans roughly 15 million jobs daily, runs mock
  interviews, benchmarks salary, offers career-clarity coaching, and introduces candidates
  directly to hiring managers, staying fiduciary to the candidate. Jill is an AI recruiter for
  companies: a hiring team briefs Jill on a role and it returns a curated shortlist from Jack's
  network of 302,000+ pre-vetted professionals (engineers, product, design, marketing, sales,
  operations, leadership) within minutes, handling outreach, scheduling, and pipeline
  management. Operated by Tinker Tailor Talent Ltd. (founded 2024, London and San Francisco),
  the company raised a $20M seed round led by Creandum. Pricing is a 10% success fee on
  first-year base salary charged only on a successful hire, with a three-month full-refund
  guarantee; free for candidates. There is no public developer API today (confirmed via the
  site's ai.txt); this profile captures the company's real published web, AI-discovery, and
  security surface.
